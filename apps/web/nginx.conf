server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the API's 5 MB import limit so the API can return a friendly error.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location ~ ^/(api|uploads|feeds)/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File names contain a content hash, so these can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes are served the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
